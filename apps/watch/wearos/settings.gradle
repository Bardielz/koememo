pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
dependencyResolutionManagement.repositories.exclusiveContent {
    forRepository {
        ivy {
            url = uri('https://github.com/k2-fsa/sherpa-onnx/releases/download')
            patternLayout { artifact 'v[revision]/[artifact]-[revision].[ext]' }
            metadataSources { artifact() }
        }
    }
    filter { includeModule 'com.k2fsa', 'sherpa-onnx' }
}
rootProject.name = 'KoeMemo'
include ':app'

include ':recording:domain', ':recording:application'

include ':phone'
project(':phone').projectDir = file('../../phone/android')

include ':transfer:contract'
if (providers.gradleProperty('wearDataLayer').getOrElse('true').toBoolean()) include ':transfer:data-layer'
include ':vendor:samsung-performance'

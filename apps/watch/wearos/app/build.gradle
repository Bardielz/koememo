plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'dev.watchmemory'
    compileSdk 35
    defaultConfig { applicationId 'dev.watchmemory'; minSdk 30; targetSdk 35; versionCode 8; versionName '0.1.7-dev' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    lint { abortOnError true }
}
dependencies { implementation project(':recording:application'); testImplementation 'junit:junit:4.13.2' }

dependencies {
    implementation 'androidx.wear:wear-ongoing:1.0.0'
    implementation 'androidx.wear.tiles:tiles:1.4.1'
    implementation 'androidx.wear.watchface:watchface-complications-data-source:1.2.1'
    implementation 'com.google.guava:guava:33.2.1-android'
    implementation project(':transfer:contract')
    if (findProject(':transfer:data-layer') != null) implementation project(':transfer:data-layer')
}
android.sourceSets.main.java.srcDir rootProject.file('../../../packages/contracts/audio/src')
android.sourceSets.main.java.srcDir rootProject.file('../../../packages/android/telemetry/src')
